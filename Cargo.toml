[package]
name = "eywa"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Watches the coding agents on your machine and tells any program which ones need you"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "eywa"
path = "src/main.rs"

[workspace]
members = ["eywa-api"]

[dependencies]
eywa-api = { path = "eywa-api" }
humantime = "2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
